name: Build

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm]
        compiler: [gcc, clang]

    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Daha güncel sürüm (v3 yerine v4)

      - name: Setup Alpine Linux
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.arch }} # Matristeki mimariyi Alpine'e bildirmek iyi bir pratiktir

      - name: Prepare build environment
        run: ./.ci-prepare.sh ${{ matrix.compiler }}
        shell: alpine.sh --root {0}

      - name: Build
        run: ./.ci-build.sh
        shell: alpine.sh -- {0} # {0} öncesi '--' eklendi

      - name: Collect files
        run: |
          mkdir -p release
          find . -type f \
            ! -path "./.git/*" \
            ! -path "./release/*" \
            -size +0c \
            -exec cp --parents {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: release/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
